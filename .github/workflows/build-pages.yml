name: Build GitHub Pages

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches-ignore:
      - web
      - main

jobs:
  build-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip, curl

      - name: Clone source for mod-ale
        if: github.ref_name == 'mod-ale'
        run: |
          rm -rf source/mod-ale
          git clone --depth=1 https://github.com/azerothcore/mod-ale.git source/mod-ale

      - name: Clone source for Eluna branches
        if: >
          github.ref_name == 'ElunaTrinityCore' ||
          github.ref_name == 'ElunaAzerothCore' ||
          github.ref_name == 'ElunaCMangos' ||
          github.ref_name == 'ElunaMangos' ||
          github.ref_name == 'ElunaVMangos'
        run: |
          rm -rf source/Eluna
          git clone --depth=1 https://github.com/ElunaLuaEngine/Eluna.git source/Eluna

      - name: Generate branch site
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: php generate.php

      - name: Deploy branch site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: web
          destination_dir: ${{ github.ref_name }}
          keep_files: true

  build-index:
    runs-on: ubuntu-latest
    needs: build-branch
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip, curl

      - name: Generate root index
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          BRANCH_NAME: __index__
        run: php generate.php

      - name: Deploy root index
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: web
          destination_dir: .
          keep_files: true